# Блокировка при простое и перед сном. Запускается из hyprland.lua.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Под hyprland.lua обычный "hyprctl dispatch dpms on" не работает
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    # Видео и другие программы могут запрещать блокировку на время работы
    ignore_dbus_inhibit = false
}

# За минуту до блокировки
listener {
    timeout = 540
    on-timeout = notify-send -t 5000 "Простой" "Через минуту экран заблокируется"
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Экран блокировки в стиле dashboard: размытый снимок экрана, моноширинный шрифт,
# цвета терминала (kanagawa-dragon). Блокировка: Super+L, а также hypridle.conf.

$fg     = rgb(c5c9c5)
$dim    = rgb(a6a69c)
$cyan   = rgb(8ea4a2)
$yellow = rgb(c4b28a)
$red    = rgb(c4746e)
$font   = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    color = rgb(000000)
    blur_passes = 3
    blur_size = 4
    brightness = 0.45
}

# Время
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 72
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

# Дата
label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    color = $dim
    font_size = 14
    font_family = $font
    position = 0, 50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 44
    outline_thickness = 1
    rounding = 0
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = $cyan
    inner_color = rgba(000000e6)
    font_color = $fg
    font_family = $font
    check_color = $yellow
    fail_color = $red
    capslock_color = $yellow
    fade_on_empty = false
    placeholder_text = <span foreground='##8ea4a2'>▶</span> пароль
    fail_text = $FAIL ($ATTEMPTS)
    position = 0, -30
    halign = center
    valign = center
}

# Раскладка: пароль часто набирают не в той
label {
    monitor =
    text = $LAYOUT
    color = $dim
    font_size = 11
    font_family = $font
    position = 0, -80
    halign = center
    valign = center
}
